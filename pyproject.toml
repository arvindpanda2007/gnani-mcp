[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gnani-mcp-remote"
version = "0.1.0"
description = "Render-deployable remote MCP server for Gnani AI STT, TTS, and speaker-embedding voice clone."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "gnani-mcp-remote" }]
dependencies = [
    "mcp[cli]>=1.12.4",
    "gnani-vachana>=0.7.9",
    "starlette>=0.39.0",
    "uvicorn[standard]>=0.32.0",
]
[project.scripts]
gnani-mcp-remote = "gnani_mcp_remote.server:main"
[tool.setuptools.packages.find]
where = ["src"]
